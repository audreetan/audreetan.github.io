<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 510">
  <defs>
    <radialGradient id="halo">
      <stop stop-color="#7848de" stop-opacity=".56"/>
      <stop offset=".65" stop-color="#6940b4" stop-opacity=".2"/>
      <stop offset="1" stop-color="#6940b4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="grid-fade">
      <stop stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="27" height="27" patternUnits="userSpaceOnUse">
      <path d="M27 0H0v27" fill="none" stroke="#bb9eff" stroke-opacity=".37"/>
      <circle cx="1" cy="1" r="1.2" fill="#c9b4ff" fill-opacity=".6"/>
    </pattern>
    <mask id="grid-mask">
      <ellipse cx="307" cy="234" rx="291" ry="228" fill="url(#grid-fade)"/>
    </mask>
    <linearGradient id="mint" x2=".8" y2="1">
      <stop stop-color="#c0ffdc"/><stop offset="1" stop-color="#61d9ad"/>
    </linearGradient>
    <linearGradient id="blue" x2=".8" y2="1">
      <stop stop-color="#a0c5ff"/><stop offset="1" stop-color="#6673f2"/>
    </linearGradient>
    <linearGradient id="lilac" x2=".8" y2="1">
      <stop stop-color="#e5d8ff"/><stop offset="1" stop-color="#a78df9"/>
    </linearGradient>
    <linearGradient id="cream" x2=".8" y2="1">
